<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Elite Styles Salon & Spa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Include navigation bar here (same as index.html) -->

    <!-- Book Appointment Section -->
    <section class="book-appointment">
        <h2>Book Your Appointment</h2>
        <form id="appointment-form" action="submit_booking.php" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="service">Choose Service</label>
                <select id="service" name="service" required>
                    <option value="haircut">Haircut & Styling</option>
                    <option value="shave">Hot Towel Shave</option>
                    <option value="spa">Spa Treatments</option>
                    <option value="massage">Massage Therapy</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="time">Select Time</label>
                <input type="time" id="time" name="time" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
            </div>
            <button type="submit" class="btn">Book Appointment</button>
        </form>
    </section>

    <!-- Footer Section (same as index.html) -->

    <script src="script.js"></script>
</body>
</html>
